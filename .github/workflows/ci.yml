name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run common unit tests (SpotScorer, TideClassifier)
        run: ./gradlew :composeApp:allTests --stacktrace

      - name: Assemble debug APK (smoke, unsigned)
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      - name: Upload debug APK (sideloadable for field testing)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: balisurf-debug-apk
          path: composeApp/build/outputs/apk/debug/composeApp-debug.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: composeApp/build/reports/tests/
