org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
kotlin.multiplatform.enableDefaultHierarchyTemplate=true

# AGP 9 dropped support for combining 'com.android.application' with the Kotlin
# Multiplatform plugin in one module. Its recommended fix is to split the module
# into a KMP library plus a separate Android application module. These two flags
# are AGP's supported bypass and keep the single-module layout working, matching
# the sibling apps (slovo, indonesian-app). Revisit before AGP removes them.
android.builtInKotlin=false
android.newDsl=false
